<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>올리브영</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="">홈</a>
        <a href="">오특</a>
        <a href="">랭킹</a>
        <a href="">매거진</a>
        <a href="">LUXE EDIT</a>
        <a href="">세일</a>
        <a href="">기획전</a>
      </nav>
    </header>

    <main>
      <section class="event-category">
        <div class="event-title">
          <h2>인기행사만 모았어요</h2>
          <a href="">더보기</a>
        </div>
        <div class="category-tab">
          <a href="">사이사이건강간식</a>
          <a href="">골라쓰는UV케어</a>
          <a href="">초밀착 화잘먹썬</a>
        </div>
      </section>

      <hero class="promotion">
        <div class="promotion-img">
          <img
            src="https://picsum.photos/seed/prod1/600/600"
            alt="소이조이 건강간식"
          />
        </div>
        <div class="promotion-text">
          <h2>대두 영양을 통째로<br />소이조이 건강간식</h2>
          <p>신규 4종 출시 기념 특가</p>
        </div>
      </hero>
      <section class="product">
        <article class="product-item">
          <div class="product-img">
            <img src="https://picsum.photos/seed/prod2/150/150" alt="" />
          </div>
          <div class="product-content">
            <div class="product-info">
              <h3>[레리pick] 소이조이 에너지바 8종 택1</h3>
            </div>

            <div class="price">
              <strong>18%</strong>
              <p>1,380원</p>
              <del>1,700</del>
            </div>

            <div class="tags">
              <span>오늘드림</span>
              <span class="tags-best">BEST</span>
            </div>
          </div>

          <button class="like">♡</button>
        </article>

        <article class="product-item">
          <div class="product-img">
            <img src="https://picsum.photos/seed/prod3/150/150" alt="" />
          </div>

          <div class="product-content">
            <div class="product-info">
              <h3>[레리pick] 소이조이 에너지바 스위트 포테이토 30G</h3>
            </div>

            <div class="price">
              <strong>18%</strong>
              <p>1,380원</p>
              <del>1,700</del>
            </div>

            <div class="tags">
              <span>오늘드림</span>
            </div>
          </div>

          <button class="like">♡</button>
        </article>
      </section>

      <div class="floating-button">
        <button class="chat">헬스+</button>
        <button class="top">↑</button>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
