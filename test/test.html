<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        width: 100%;
        height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
      }
      section {
        text-align: center;
        align-content: center;
        background-color: #3140a0;
        color: white;
        height: 35vh;
      }
      section h1 {
        font-size: 40px;
      }
      .logo {
        display: flex;
        background-color: #ffffff;
        color: #1b2581;
        font-size: 20px;
        flex-direction: row;
        justify-content: space-between;
        padding-left: 2%;
        height: 7vh;
      }
      nav {
        color: #707370;
        font-size: 15px;
        font-weight: bold;
        padding-right: 2%;
        height: 4vh;
      }
      main {
        margin: 0 auto;
        background-color: #f9f9f9;
      }
      .menu-grid {
        background-color: white;
        display: flex;
        flex-direction: row;
        justify-content: space-evenly;
        align-items: center;
        height: 40vh;
      }
      .card {
        border-radius: 10px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        text-align: center;
        width: 31%;
        height: 70%;
      }
      .menu-name {
        color: #1a2371;
      }
      .menu-desc {
        color: #707370;
        margin-left: 20px;
        margin-right: 20px;
      }
      footer {
        text-align: center;
        align-content: center;
        background-color: #333333;
        color: white;
        height: 10vh;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">
        <h3>BRAND<span style="color: #00bcd4">LOGO</span></h3>
        <nav>
          <ul class="navi">
            <ui>소개</ui>
            <ui>서비스</ui>
            <ui>문의하기</ui>
          </ul>
        </nav>
      </div>
    </header>
    <section>
      <div>
        <h1>더 나은 미래를 만드는 혁신</h1>
        <p>우리는 가장 단순한 방법으로 최고의 가치를 전달합니다.</p>
      </div>
    </section>
    <main>
      <div class="menu-grid">
        <div class="card">
          <h1>🚀</h1>
          <h3 class="menu-name">빠른 속도</h3>
          <p class="menu-desc">
            최신 기술을 활용하여 가장 빠른 퍼포먼스를 보장합니다.
          </p>
        </div>

        <div class="card">
          <h1>💎</h1>
          <h3 class="menu-name">높은 품질</h3>
          <p class="menu-desc">
            정교한 코드와 디자인으로 최상의 결과물을 제공합니다.
          </p>
        </div>

        <div class="card">
          <h1>🤝</h1>
          <h3 class="menu-name">고객 신뢰</h3>
          <p class="menu-desc">
            언제나 고객의 목소리에 귀 기울이며 함께 성장합니다.
          </p>
        </div>
      </div>
    </main>
    <footer>
      <p>&copy; 2026 Brand Design. All rights reserved.</p>
    </footer>
  </body>
</html>
